[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "em_toolkit"
version = "0.1.0"
description = "Librería reutilizable de objetos de electromagnetismo para animaciones con Manim"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Estiven" }]
keywords = ["electromagnetism", "physics", "manim", "animation", "education"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# La capa visual. Se instala aparte porque la física no la necesita.
viz = ["manim>=0.20,<0.21"]
# Herramientas de desarrollo y pruebas.
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
